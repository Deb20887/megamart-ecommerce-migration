apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: megamart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Deb20887/megamart-ecommerce-migration.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: megamart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
