apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: megamart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service-account
      containers:
        - name: megamart-order
          image: 825269749252.dkr.ecr.ap-south-1.amazonaws.com/megamart-order:2.0
          ports:
            - containerPort: 8001
          env:
            - name: ORDERS_TABLE
              value: MegaMartOrders
            - name: AWS_REGION
              value: ap-south-1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
